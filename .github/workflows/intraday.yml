name: Titik cek spike

on:
  schedule:
    - cron: "33 2 * * 1-5"   # 09.33 WIB  - Pembukaan
    - cron: "4 7 * * 1-4"    # 14.04 WIB  - Setelah istirahat (Senin-Kamis)
    - cron: "34 7 * * 5"     # 14.34 WIB  - Setelah istirahat (Jumat)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  spike:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hitung spike
        run: python3 scripts/intraday.py
      - name: Simpan hasil
        run: |
          git config user.name "robot-harga"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/intraday.json
          if git diff --cached --quiet; then echo "Tidak ada perubahan"; exit 0; fi
          git commit -m "Spike $(TZ=Asia/Jakarta date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
