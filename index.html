<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Warning Emiten</title>
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Warning Emiten">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#141821;--mute:#6b7280;--line:#e5e7eb;--merah:#dc2626;--kuning:#d97706;--hijau:#16a34a;--biru:#2563eb;--chip:#f1f5f9;--nav:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0b0f17;--card:#151b26;--ink:#e8ebf1;--mute:#9aa3b2;--line:#253041;--merah:#f87171;--kuning:#fbbf24;--hijau:#4ade80;--biru:#60a5fa;--chip:#1e2633;--nav:#111722}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 12px) 16px 8px;display:flex;align-items:center;gap:8px}
header h1{font-size:20px;margin:0;flex:1}
header .sub{font-size:12px;color:var(--mute);font-weight:400;display:block}
.ikon{border:0;background:var(--chip);color:var(--ink);width:38px;height:38px;border-radius:12px;font-size:18px;cursor:pointer}
main{padding:4px 12px calc(84px + env(safe-area-inset-bottom))}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;display:flex;background:var(--nav);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;color:var(--mute);padding:9px 0 8px;font-size:12px;cursor:pointer}
nav button b{display:block;font-size:20px;line-height:1.2}
nav button.on{color:var(--biru);font-weight:600}
.card{background:var(--card);border-radius:16px;padding:12px 14px;margin:8px 0;border:1px solid var(--line)}
.row{display:flex;align-items:center;gap:10px}
.lampu{width:12px;height:12px;border-radius:50%;flex:none}
.lampu.merah{background:var(--merah)}.lampu.kuning{background:var(--kuning)}.lampu.hijau{background:var(--hijau)}
.kode{font-weight:700;font-size:16px}
.mute{color:var(--mute);font-size:13px}
.kanan{margin-left:auto;text-align:right}
.naik{color:var(--hijau)}.turun{color:var(--merah)}
.label{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--chip);margin-top:4px}
.label.merah{color:var(--merah)}.label.hijau{color:var(--hijau)}.label.kuning{color:var(--kuning)}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);margin:18px 4px 6px}
.ok{text-align:center;padding:40px 16px}
.ok b{font-size:40px;display:block}
.ev{font-size:14px;margin-top:4px}
.ev li{margin:2px 0}
ul{padding-left:18px;margin:4px 0}
a{color:var(--biru);text-decoration:none}
.b-Bahaya{color:var(--merah);font-weight:600}.b-Waspada{color:var(--kuning);font-weight:600}.b-Positif{color:var(--hijau);font-weight:600}.b-Netral{color:var(--mute)}
.lembar{position:fixed;inset:0;z-index:10;background:var(--bg);overflow:auto;padding:calc(env(safe-area-inset-top) + 8px) 12px calc(24px + env(safe-area-inset-bottom));display:none}
.lembar.buka{display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid div{background:var(--chip);border-radius:12px;padding:8px 10px}
.grid small{display:block;color:var(--mute);font-size:11px}
.grid b{font-size:15px}
svg.grafik{width:100%;height:170px;display:block}
input{font:inherit;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);width:100%}
.tombol{border:0;background:var(--biru);color:#fff;font:inherit;font-weight:600;padding:12px 16px;border-radius:12px;width:100%;cursor:pointer;margin-top:10px}
.tombol.dua{background:var(--chip);color:var(--ink)}
.pin{max-width:340px;margin:12vh auto 0;text-align:center}
.pin input{text-align:center;font-size:24px;letter-spacing:.4em}
.tabel{width:100%;border-collapse:collapse}.tabel td{padding:4px 2px}.tabel input{padding:8px}
.kecil{font-size:12px}
.st{font-size:12px;padding:2px 8px;border-radius:999px;font-weight:600}.st-Terkonfirmasi{background:var(--merah);color:#fff}.st-Muncul{background:var(--chip);color:var(--kuning)}.st-Pudar{background:var(--chip);color:var(--mute)}
.titik{display:flex;gap:6px;margin:4px 4px 0;flex-wrap:wrap}.titik span{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--mute)}.titik span.on{color:var(--ink);font-weight:600}
.peringatan{background:#fef3c7;color:#92400e;border-radius:12px;padding:8px 12px;font-size:13px;margin:8px 0}
@media (prefers-color-scheme:dark){.peringatan{background:#3b2f0b;color:#fde68a}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const REPO = "udahdengar-ai/warning-emiten";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rp = x => x == null ? "–" : "Rp" + Math.round(x).toLocaleString("id-ID");
const pct = x => x == null ? "–" : (x > 0 ? "+" : "") + x.toFixed(1).replace(".", ",") + "%";
const simpan = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(e){} }, del(k){ try { localStorage.removeItem(k); } catch(e){} } };
let D = {}, RATA = null, LEWATI = false, TAB = simpan.get("tab") || "hari", RIW = null;

async function ambil(n){ const r = await fetch("data/" + n + "?t=" + Date.now(), {cache:"no-store"}); if(!r.ok) throw new Error(n); return r.json(); }
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const keB64 = u => btoa(String.fromCharCode(...new Uint8Array(u)));
async function kunciDari(pin, salt, iter){
  const k = await crypto.subtle.importKey("raw", new TextEncoder().encode(pin), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:iter, hash:"SHA-256"}, k, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
}
async function buka(pin){
  const r = D.rahasia; if(!r) return null;
  const k = await kunciDari(pin, b64(r.salt), r.iter);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(r.iv)}, k, b64(r.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function kunci(pin, obj){
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12)), iter = 250000;
  const k = await kunciDari(pin, salt, iter);
  const ct = await crypto.subtle.encrypt({name:"AES-GCM", iv}, k, new TextEncoder().encode(JSON.stringify(obj)));
  return JSON.stringify({v:1, iter, salt:keB64(salt), iv:keB64(iv), ct:keB64(ct)});
}

// ---------- olah data ----------
function olah(s){
  const rata = RATA ? RATA[s.kode] : undefined, pegang = rata != null;
  let label = pegang ? s.label_pegang : s.label_belum, cat = pegang ? s.catatan_pegang : s.catatan_belum;
  const pos = pegang ? (s.harga / rata - 1) * 100 : null;
  if (pegang && label === "Dekat area tambah"){ const d = (s.lantai / rata - 1) * 100; cat += ` Lantai ${rp(s.lantai)} berada ${Math.abs(d).toFixed(1).replace(".",",")}% di ${d>0?"atas":"bawah"} rata-rata Anda.`; }
  if (pegang && label === "Dekat area kurangi"){ const d = (s.atap / rata - 1) * 100; cat += ` Atap ${Math.abs(d).toFixed(1).replace(".",",")}% di ${d>0?"atas":"bawah"} rata-rata Anda, jadi mengurangi di sana berarti ${d>0?"ambil untung":"jual rugi"}.`; }
  let lampu = "kuning";
  if (s.level >= 3 || s.level_grafik >= 2 || /jebol|Bahaya/.test(label) || label === "Dekat area kurangi") lampu = "merah";
  else if (label === "Dekat area tambah" || label === "Dekat area masuk") lampu = "hijau";
  const ubah = [...(s.perubahan || [])];
  const seb = s._seb;
  if (seb){ const l0 = pegang ? seb.label_pegang : seb.label_belum; if (l0 && l0 !== label) ubah.push(`Posisi: ${l0} → ${label}`); }
  return {...s, rata, pegang, label, cat, pos, lampu, ubah};
}
const hariLalu = t => Math.floor((Date.now() - new Date(t + "T00:00:00+07:00")) / 864e5);
function beritaKode(k){ return (D.berita?.berita || []).filter(b => b.kode === k).sort((a,b) => b.tanggal.localeCompare(a.tanggal)); }

// ---------- tampilan ----------
function kartu(x){
  return `<div class="card" onclick="detail('${x.kode}')"><div class="row">
    <span class="lampu ${x.lampu}"></span>
    <div><div class="kode">${x.kode}</div><span class="label ${x.lampu}">${esc(x.label)}</span></div>
    <div class="kanan"><div><b>${rp(x.harga)}</b></div><div class="mute"><span class="${x.ubah_1h>=0?'naik':'turun'}">${pct(x.ubah_1h)}</span>${x.pegang?` · vs rata ${pct(x.pos)}`:""}</div></div>
  </div></div>`;
}
const hariIniWIB = () => new Date(Date.now() + 7*36e5).toISOString().slice(0,10);
function spikeHariIni(L){
  const I = D.intraday; if (!I || I.tanggal !== hariIniWIB()) return "";
  const T = I.titik || {}, urut = ["pagi","siang","tutup"], nama = {pagi:"Pembukaan", siang:"Setelah istirahat", tutup:"Penutupan"};
  const akhir = urut.filter(t => T[t]).pop();
  const strip = `<div class="titik">${urut.map(t => `<span class="${T[t]?"on":""}">${T[t]?"✓":"○"} ${nama[t]}${T[t]?" "+T[t].jam_data.replace(":","."):""}</span>`).join("")}</div>
    <div class="mute kecil" style="margin:4px">Data per ${T[akhir].jam_data.replace(":",".")} · robot jalan ${T[akhir].dijalankan.replace(":",".")} WIB · ambang 3%</div>`;
  const peg = k => (L.find(x => x.kode === k) || {}).pegang ? 1 : 0;
  const S = Object.entries(I.status || {}).map(([k,v]) => ({k, ...v})).sort((a,b) => ({Terkonfirmasi:0,Muncul:1,Pudar:2}[a.status] - {Terkonfirmasi:0,Muncul:1,Pudar:2}[b.status]) || peg(b.k) - peg(a.k));
  const isi = S.length ? S.map(x => `<div class="card" onclick="detail('${x.k}')" style="${x.status==="Pudar"?"opacity:.7":""}"><div class="row"><span class="kode">${x.k}</span><span class="${x.arah==="naik"?"naik":"turun"}" style="font-weight:700">${x.arah==="naik"?"▲":"▼"}</span><span class="st st-${x.status}">${x.status}</span>${peg(x.k)?"":`<span class="mute kecil">pantauan</span>`}</div><ul class="ev">${x.catatan.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div>`).join("")
    : `<div class="card mute">Belum ada spike ≥3% hari ini.</div>`;
  return `<h2>Spike hari ini</h2>${strip}${isi}`;
}
function hariIni(L){
  const brBaru = (D.berita?.berita || []).filter(b => hariLalu(b.tanggal) <= 4);
  const ev = L.map(x => {
    const it = [];
    if (x.ubah.length) it.push(...x.ubah);
    if (/jebol|Bahaya/.test(x.label)) it.push(x.label + ": " + x.cat);
    if (x.level_grafik >= 1 && x.pola) it.push("Grafik " + x.status_grafik + ": " + x.pola);
    if (x.status_volume === "Melonjak") it.push(`Volume melonjak (${x.rasio_volume.toString().replace(".",",")}x rata-rata 20 hari)`);
    brBaru.filter(b => b.kode === x.kode).forEach(b => it.push(`Berita ${b.dampak}: ${b.judul}`));
    return {x, it: [...new Set(it)]};
  }).filter(e => e.it.length).sort((a,b) => (b.x.pegang - a.x.pegang) || ({merah:0,hijau:1,kuning:2}[a.x.lampu] - {merah:0,hijau:1,kuning:2}[b.x.lampu]));
  const sp = spikeHariIni(L);
  if (!ev.length) return sp + `<div class="ok"><b>✅</b><h3>Aman</h3><div class="mute">Tidak ada perubahan lain sejak penutupan sebelumnya.</div></div>`;
  const blok = (judul, arr) => arr.length ? `<h2>${judul}</h2>` + arr.map(e => `<div class="card" onclick="detail('${e.x.kode}')"><div class="row"><span class="lampu ${e.x.lampu}"></span><span class="kode">${e.x.kode}</span><span class="kanan mute">${rp(e.x.harga)} <span class="${e.x.ubah_1h>=0?'naik':'turun'}">${pct(e.x.ubah_1h)}</span></span></div><ul class="ev">${e.it.map(t => `<li>${esc(t)}</li>`).join("")}</ul></div>`).join("") : "";
  return sp + (sp ? `<h2 style="margin-top:22px">Penutupan ${esc(D.sinyal?.meta?.tanggal_harga||"")}</h2>` : "") + blok("Yang kamu pegang", ev.filter(e => e.x.pegang)) + blok(RATA ? "Pantauan" : "Emiten", ev.filter(e => !e.x.pegang));
}
function porto(L){
  const urut = a => a.sort((p,q) => ({merah:0,hijau:1,kuning:2}[p.lampu] - {merah:0,hijau:1,kuning:2}[q.lampu]) || p.kode.localeCompare(q.kode));
  const a = urut(L.filter(x => x.pegang)), b = urut(L.filter(x => !x.pegang));
  return `<div class="mute kecil" style="margin:4px">🟢 dekat area tambah · 🟡 tahan · 🔴 waspada / dekat area kurangi</div>`
    + (a.length ? `<h2>Dipegang (${a.length})</h2>` + a.map(kartu).join("") : "")
    + (b.length ? `<h2>${RATA ? "Pantauan" : "Semua emiten"} (${b.length})</h2>` + b.map(kartu).join("") : "");
}
function tabBerita(){
  const urut = {Bahaya:0, Waspada:1, Positif:2, Netral:3};
  const br = [...(D.berita?.berita || [])].filter(b => b.berlaku || hariLalu(b.tanggal) <= (b.dampak === "Bahaya" ? 90 : 30))
    .sort((a,b) => (a.dampak==="Bahaya"?0:1) - (b.dampak==="Bahaya"?0:1) || b.tanggal.localeCompare(a.tanggal));
  const j = (D.judul?.rows || []).filter(x => x.judul);
  return `<div class="mute kecil" style="margin:4px">Rangkuman diperbarui Claude tiap Senin & Kamis. Terakhir: ${esc(D.berita?.dicek_pada || "–")}</div>`
    + br.map(b => `<div class="card"><div class="row"><span class="kode">${b.kode}</span><span class="b-${b.dampak}">${b.dampak}</span><span class="kanan mute">${b.tanggal}</span></div><div style="margin-top:4px">${esc(b.judul)}</div><div class="mute kecil">${esc(b.sumber)}${b.url?` · <a href="${esc(b.url)}" target="_blank" rel="noopener">buka</a>`:""}</div></div>`).join("")
    + (j.length ? `<h2>Judul terbaru (otomatis, belum dinilai)</h2>` + j.map(x => `<div class="card"><div class="row"><span class="kode">${x.kode}</span><span class="kanan mute">${x.tanggal}</span></div><div style="margin-top:4px">${esc(x.judul)}</div><div class="mute kecil">${esc(x.sumber)} · <a href="${esc(x.url)}" target="_blank" rel="noopener">buka</a></div></div>`).join("") : "");
}
function grafik(x){
  const h = (D.harga?.rows || []).filter(r => r[0] === x.kode);
  if (h.length < 2) return "";
  const W = 340, H = 170, P = 6, ys = h.map(r => r[2]), lv = [x.lantai, x.atap, x.rata].filter(v => v != null);
  const lo = Math.min(...ys, ...lv) * 0.98, hi = Math.max(...ys, ...lv) * 1.02;
  const X = i => P + i * (W - 2*P) / (h.length - 1), Y = v => H - P - (v - lo) * (H - 2*P) / (hi - lo);
  const garis = (v, warna, teks) => v == null ? "" : `<line x1="0" x2="${W}" y1="${Y(v)}" y2="${Y(v)}" stroke="${warna}" stroke-dasharray="4 4" stroke-width="1.2"/><text x="${W-4}" y="${Y(v)-4}" text-anchor="end" font-size="10" fill="${warna}">${teks} ${rp(v)}</text>`;
  return `<svg class="grafik" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    ${garis(x.atap, "var(--merah)", "atap")}${garis(x.lantai, "var(--hijau)", "lantai")}${garis(x.rata, "var(--biru)", "rata-rata")}
    <polyline fill="none" stroke="var(--ink)" stroke-width="1.8" points="${h.map((r,i) => X(i).toFixed(1)+","+Y(r[2]).toFixed(1)).join(" ")}"/></svg>
    <div class="mute kecil">60 hari bursa terakhir · ${h[0][1]} s/d ${h[h.length-1][1]}</div>`;
}
async function detail(k){
  const x = olah(D.sinyal.rows.find(s => s.kode === k)); const el = $("#lembar");
  const br = beritaKode(k).slice(0, 3);
  const isi = rap => `<div class="row"><button class="ikon" onclick="tutup()">←</button><div><div class="kode" style="font-size:20px">${x.kode}</div><div class="mute">${esc(x.nama)}</div></div><div class="kanan"><b style="font-size:18px">${rp(x.harga)}</b><div class="${x.ubah_1h>=0?'naik':'turun'}">${pct(x.ubah_1h)}</div></div></div>
    <div class="card"><div class="row"><span class="lampu ${x.lampu}"></span><b>${esc(x.label)}</b></div><div style="margin-top:4px">${esc(x.cat)}</div></div>
    <div class="card">${grafik(x)}</div>
    <div class="grid">
      <div><small>Area tambah (lantai)</small><b>${rp(x.lantai)}</b></div><div><small>Area kurangi (atap)</small><b>${rp(x.atap)}</b></div>
      <div><small>Batas gagal</small><b>${rp(x.batas_gagal)}</b></div><div><small>Rata-rata beli</small><b>${x.pegang ? rp(x.rata) : "Belum dipegang"}</b></div>
      <div><small>Posisi vs rata-rata</small><b class="${(x.pos||0)>=0?'naik':'turun'}">${x.pegang ? pct(x.pos) : "–"}</b></div><div><small>Dibanding IHSG (20 hari)</small><b>${esc(x.kekuatan)}</b></div>
    </div>
    ${x.ubah.length ? `<h2>Berubah sejak penutupan sebelumnya</h2><div class="card"><ul>${x.ubah.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div>` : ""}
    <h2>Status</h2><div class="card">
      <div><b>Grafik:</b> ${esc(x.status_grafik)}${x.pola ? " – " + esc(x.pola) : ""}</div>
      <div><b>Berita:</b> ${esc(x.status_berita)}${x.alasan_berita ? " – " + esc(x.alasan_berita) : ""}</div>
      <div><b>Volume:</b> ${esc(x.status_volume)} (${String(x.rasio_volume).replace(".",",")}x rata-rata 20 hari), tren ${esc(x.tren_volume).toLowerCase()}</div>
      <div class="mute kecil" style="margin-top:4px">Harga 5 hari ${pct(x.ubah_5h)} · 20 hari ${pct(x.ubah_20h)} · MA20 ${rp(x.ma20)} · MA50 ${rp(x.ma50)}</div>
    </div>
    ${x.narasi ? `<h2>Narasi</h2><div class="card">${esc(x.narasi)}</div>` : ""}
    <h2>Berita</h2>${br.length ? br.map(b => `<div class="card"><div class="row"><span class="b-${b.dampak}">${b.dampak}</span><span class="kanan mute">${b.tanggal}</span></div><div>${esc(b.judul)}</div><div class="mute kecil">${esc(b.sumber)}${b.url?` · <a href="${esc(b.url)}" target="_blank" rel="noopener">buka</a>`:""}</div></div>`).join("") : `<div class="card mute">Tidak ada berita yang masih berlaku.</div>`}
    ${(() => { const I = D.intraday, st = I && I.tanggal === hariIniWIB() && I.status?.[x.kode]; return st ? `<h2>Spike hari ini</h2><div class="card"><div class="row"><span class="${st.arah==="naik"?"naik":"turun"}" style="font-weight:700">${st.arah==="naik"?"▲ naik":"▼ turun"}</span><span class="st st-${st.status}">${st.status}</span></div><ul class="ev">${st.catatan.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div>` : ""; })()}
    ${x.rapor_spike ? `<h2>Rapor spike ≥3% (1 tahun)</h2><div class="card"><table class="tabel kecil"><tr class="mute"><td></td><td>Kali</td><td>Bertahan</td><td>Setengah</td><td>Pudar</td></tr>${["naik","turun"].map(a => { const r = x.rapor_spike[a]; const p = v => r[0] ? Math.round(v/r[0]*100)+"%" : "–"; return `<tr><td class="${a==="naik"?"naik":"turun"}">${a==="naik"?"▲ Naik":"▼ Turun"}</td><td>${r[0]}x</td><td>${p(r[1])}</td><td>${p(r[2])}</td><td>${p(r[3])}</td></tr>`; }).join("")}</table><div class="mute kecil">Hari yang sempat bergerak ≥3% dari penutupan kemarin, lalu ditutup: bertahan (masih ≥3%), setengah, atau pudar (≤1,5%). Kalau "Pudar" tinggi, spike di emiten ini sering palsu.</div></div>` : ""}
    <h2>Rapor sinyal grafik (1 tahun)</h2><div class="card">${rap}</div>
    <div class="mute kecil" style="margin:12px 4px">Data penutupan ${x.tanggal}. Alat pantau, bukan saran beli atau jual.</div>`;
  el.innerHTML = isi(`<span class="mute">Memuat…</span>`); el.classList.add("buka"); el.scrollTop = 0;
  history.pushState({d:k}, "");
  try { if (!RIW) RIW = (await ambil("riwayat.json")).rows; } catch(e) { RIW = []; }
  const rw = RIW.filter(r => r.kode === k && r.ubah_20h != null);
  const per = {}; rw.forEach(r => { (per[r.ke] ||= []).push(r.ubah_20h); });
  const rap = Object.keys(per).length ? `<table class="tabel kecil"><tr class="mute"><td>Sinyal</td><td>Muncul</td><td>Rata-rata 20 hari sesudahnya</td><td>Naik</td></tr>` + ["Bahaya","Waspada","Pantau"].filter(s => per[s]).map(s => { const a = per[s]; const m = a.reduce((p,q)=>p+q,0)/a.length; return `<tr><td class="b-${s==="Pantau"?"Positif":s}">${s}</td><td>${a.length}x</td><td class="${m>=0?'naik':'turun'}">${pct(m)}</td><td>${Math.round(a.filter(v=>v>0).length/a.length*100)}%</td></tr>`; }).join("") + `</table><div class="mute kecil">Contoh: kalau sinyal Bahaya rata-rata diikuti harga turun, sinyal itu bisa dipercaya untuk emiten ini.</div>` : `<span class="mute">Belum cukup data.</span>`;
  if ($("#lembar").classList.contains("buka")) el.innerHTML = isi(rap);
}
function tutup(){ $("#lembar").classList.remove("buka"); }
window.addEventListener("popstate", () => { tutup(); $("#atur").classList.remove("buka"); });

function atur(){
  const el = $("#atur"); const kodes = D.emiten?.kode || [];
  const m = D.sinyal?.meta || {};
  el.innerHTML = `<div class="row"><button class="ikon" onclick="history.back()">←</button><h3 style="margin:0">Pengaturan</h3></div>
    <div class="card kecil"><div><b>Harga terakhir:</b> penutupan ${esc(m.tanggal_harga||"–")} (diambil ${esc(m.dijalankan||"–")})</div><div><b>Rangkuman berita:</b> ${esc(D.berita?.dicek_pada||"–")}</div>${(m.gagal||[]).length?`<div class="peringatan">Gagal diambil: ${esc(m.gagal.join("; "))}</div>`:""}</div>
    <h2>Rata-rata beli & PIN</h2>
    <div class="card">${RATA ? `<div class="kecil mute">Isi angka untuk emiten yang dipegang, kosongkan untuk yang belum. Lalu buat kode terkunci dan tempel di GitHub.</div>
      <table class="tabel">${kodes.map(k => `<tr><td class="kode">${k}</td><td><input inputmode="numeric" id="r_${k}" value="${RATA[k] ?? ""}" placeholder="belum dipegang"></td></tr>`).join("")}</table>
      <div style="margin-top:8px"><input id="pinbaru" inputmode="numeric" placeholder="PIN baru (kosongkan = PIN sama)"></div>
      <button class="tombol" onclick="buatKode()">Buat kode terkunci</button><div id="hasilkode"></div>`
      : `<div class="mute">Masukkan PIN dulu untuk mengubah rata-rata beli.</div><button class="tombol" onclick="history.back();layarPin()">Masukkan PIN</button>`}
    </div>
    <h2>Lainnya</h2>
    <div class="card"><button class="tombol dua" onclick="lupakan()">Hapus PIN dari HP ini</button>
    <div class="mute kecil" style="margin-top:8px">Daftar emiten diubah di file data/emiten.json di GitHub, atau minta Claude lewat chat.</div></div>`;
  el.classList.add("buka"); history.pushState({a:1}, "");
}
async function buatKode(){
  const obj = {}; for (const k of D.emiten.kode){ const v = parseFloat(($("#r_"+k).value||"").replace(/\./g,"").replace(",", ".")); if (v > 0) obj[k] = v; }
  const pin = $("#pinbaru").value.trim() || simpan.get("pin");
  if (!pin || pin.length < 4) { alert("PIN minimal 4 angka."); return; }
  const kode = await kunci(pin, obj);
  try { await navigator.clipboard.writeText(kode); } catch(e) {}
  $("#hasilkode").innerHTML = `<div class="peringatan">Kode sudah disalin. Langkah: 1) Buka tautan di bawah, 2) hapus semua isi file, 3) tempel kode, 4) klik <b>Commit changes</b>. Kalau gagal tersalin, salin manual dari kotak ini.</div>
    <textarea style="width:100%;height:80px;font-size:11px" readonly>${esc(kode)}</textarea>
    <a class="tombol" style="display:block;text-align:center" href="https://github.com/${REPO}/edit/main/data/rahasia.json" target="_blank" rel="noopener">Buka GitHub</a>`;
  simpan.set("pin", pin);
}
function lupakan(){ simpan.del("pin"); RATA = null; location.reload(); }

function layarPin(pesan){
  $("#app").innerHTML = `<div class="pin"><div style="font-size:44px">🔒</div><h2 style="text-transform:none;font-size:18px;color:var(--ink)">Masukkan PIN</h2>
    <div class="mute kecil">PIN membuka rata-rata belimu. Cukup sekali di HP ini.</div>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off" style="margin-top:14px">
    ${pesan ? `<div class="turun kecil" style="margin-top:6px">${pesan}</div>` : ""}
    <button class="tombol" onclick="cobaPin()">Buka</button>
    <button class="tombol dua" onclick="RATA=null;LEWATI=true;tampil()">Lewati (tanpa rata-rata beli)</button></div>`;
  setTimeout(() => $("#pin")?.focus(), 50);
  $("#pin").addEventListener("keydown", e => { if (e.key === "Enter") cobaPin(); });
}
async function cobaPin(){
  const pin = $("#pin").value.trim();
  try { RATA = await buka(pin); simpan.set("pin", pin); tampil(); } catch(e) { layarPin("PIN salah, coba lagi."); }
}
function pindah(t){ TAB = t; simpan.set("tab", t); tampil(); window.scrollTo(0,0); }
function tampil(){
  const L = (D.sinyal?.rows || []).map(olah);
  const m = D.sinyal?.meta || {};
  const telat = m.tanggal_harga && hariLalu(m.tanggal_harga) > 4;
  const isi = TAB === "hari" ? hariIni(L) : TAB === "porto" ? porto(L) : tabBerita();
  const judul = {hari:"Hari Ini", porto:"Portofolio", berita:"Berita"}[TAB];
  $("#app").innerHTML = `<header><h1>${judul}<span class="sub">Penutupan ${esc(m.tanggal_harga || "–")}</span></h1><button class="ikon" onclick="muat()" title="Muat ulang">↻</button><button class="ikon" onclick="atur()" title="Pengaturan">⚙︎</button></header>
    <main>${telat ? `<div class="peringatan">Data harga belum diperbarui sejak ${esc(m.tanggal_harga)}. Mungkin libur bursa atau robot GitHub gagal jalan.</div>` : ""}${isi}
    <div class="mute kecil" style="text-align:center;margin:18px 0">Alat pantau, bukan saran beli atau jual.</div></main>
    <nav>${[["hari","📍","Hari Ini"],["porto","📊","Portofolio"],["berita","📰","Berita"]].map(([t,i,n]) => `<button class="${TAB===t?"on":""}" onclick="pindah('${t}')"><b>${i}</b>${n}</button>`).join("")}</nav>
    <div id="lembar" class="lembar"></div><div id="atur" class="lembar"></div>`;
}
async function muat(){
  try {
    const [sinyal, harga, berita, emiten] = await Promise.all(["sinyal.json","harga.json","berita.json","emiten.json"].map(ambil));
    D = {sinyal, harga, berita, emiten};
    try { D.judul = await ambil("judul.json"); } catch(e) {}
    try { D.intraday = await ambil("intraday.json"); } catch(e) {}
    try { D.rahasia = await ambil("rahasia.json"); } catch(e) {}
    RIW = null;
  } catch(e) { $("#app").innerHTML = `<div class="ok"><b>⚠️</b>Gagal memuat data. Periksa internet lalu buka lagi.</div>`; return; }
  const pin = simpan.get("pin");
  if (D.rahasia && pin) { try { RATA = await buka(pin); } catch(e) { simpan.del("pin"); return layarPin("PIN di HP ini sudah tidak cocok (mungkin PIN diganti). Masukkan PIN baru."); } }
  if (D.rahasia && !RATA && !pin && !LEWATI) return layarPin();
  tampil();
}
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
muat();
</script>
</body>
</html>
